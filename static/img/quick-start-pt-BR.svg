<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Início rápido do VOrbit ASMR</title>
  <desc id="desc">Use fones de ouvido, escolha a rota de áudio Normal e os dispositivos, pressione Iniciar e confira os medidores. Mova a voz no modo Manual. Para rastreamento automático, conecte uma fonte e calibre o centro e a amplitude de movimento.</desc>
  <rect width="1200" height="1600" fill="#f5f7fc"/>
  <rect x="0" y="0" width="1200" height="270" fill="#15234a"/>
  <text x="72" y="92" fill="#a5c4ff" font-family="Arial, sans-serif" font-size="27" font-weight="700">VOrbit ASMR  ·  PRIMEIROS PASSOS</text>
  <text x="72" y="170" fill="#ffffff" font-family="Arial, sans-serif" font-size="62" font-weight="800">Seu primeiro som</text>
  <text x="72" y="225" fill="#d9e6ff" font-family="Arial, sans-serif" font-size="29">Coloque fones de ouvido e siga estes passos</text>
  <rect x="70" y="305" width="1060" height="715" rx="26" fill="#ffffff" stroke="#d9e1f2" stroke-width="2"/>
  <text x="110" y="360" fill="#244ab7" font-family="Arial, sans-serif" font-size="27" font-weight="800">PRIMEIRO: SOM E POSIÇÃO</text>
  <circle cx="135" cy="435" r="29" fill="#315ee0"/><text x="135" y="446" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">1</text>
  <text x="190" y="430" fill="#14223f" font-family="Arial, sans-serif" font-size="36" font-weight="700">Escolha Normal em Dispositivos</text>
  <text x="190" y="475" fill="#41526f" font-family="Arial, sans-serif" font-size="27">Entrada: microfone. Saída: fones</text>
  <path d="M135 490v36" stroke="#9cb3e8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="135" cy="560" r="29" fill="#315ee0"/><text x="135" y="571" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">2</text>
  <text x="190" y="556" fill="#14223f" font-family="Arial, sans-serif" font-size="36" font-weight="700">Pressione Iniciar e fale</text>
  <text x="190" y="601" fill="#41526f" font-family="Arial, sans-serif" font-size="27">Confira os medidores de entrada e saída E/D</text>
  <path d="M135 615v36" stroke="#9cb3e8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="135" cy="685" r="29" fill="#315ee0"/><text x="135" y="696" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">3</text>
  <text x="190" y="681" fill="#14223f" font-family="Arial, sans-serif" font-size="36" font-weight="700">Mova sua voz no Manual</text>
  <text x="190" y="726" fill="#41526f" font-family="Arial, sans-serif" font-size="27">Arraste o ponto vermelho para os lados</text>
  <rect x="190" y="766" width="895" height="196" rx="20" fill="#edf3ff"/>
  <text x="222" y="817" fill="#244ab7" font-family="Arial, sans-serif" font-size="26" font-weight="700">A configuração básica está pronta</text>
  <text x="222" y="866" fill="#273955" font-family="Arial, sans-serif" font-size="27">Ouça sua voz se mover nos fones.</text>
  <text x="222" y="916" fill="#52627b" font-family="Arial, sans-serif" font-size="24">Usa uma DAW? Veja o guia da ponte VST.</text>
  <rect x="70" y="1055" width="1060" height="415" rx="26" fill="#ffffff" stroke="#d9e1f2" stroke-width="2"/>
  <text x="110" y="1115" fill="#0b7b73" font-family="Arial, sans-serif" font-size="29" font-weight="800">SÓ SE QUISER RASTREAMENTO AUTOMÁTICO</text>
  <circle cx="135" cy="1193" r="29" fill="#118a81"/><text x="135" y="1204" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">4</text>
  <text x="190" y="1188" fill="#14223f" font-family="Arial, sans-serif" font-size="34" font-weight="700">Conecte o rastreamento no Automático</text>
  <text x="190" y="1233" fill="#41526f" font-family="Arial, sans-serif" font-size="26">Escolha a fonte, Conectar, só horizontal</text>
  <path d="M135 1248v34" stroke="#9bcfca" stroke-width="5" stroke-linecap="round"/>
  <circle cx="135" cy="1315" r="29" fill="#118a81"/><text x="135" y="1326" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">5</text>
  <text x="190" y="1310" fill="#14223f" font-family="Arial, sans-serif" font-size="34" font-weight="700">Calibre o centro e a amplitude</text>
  <text x="190" y="1355" fill="#41526f" font-family="Arial, sans-serif" font-size="26">Centro, depois mova-se; veja Calibrado</text>
  <text x="72" y="1535" fill="#52627b" font-family="Arial, sans-serif" font-size="23">Detalhes, ponte VST e solução de problemas estão abaixo.</text>
</svg>
