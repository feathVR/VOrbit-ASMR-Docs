<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc"><title id="title">VSTブリッジの音声経路</title><desc id="desc">マイクからDAWのマイクトラック内のVOrbit Bridgeを通り、DAW出力からヘッドホンへ。Bridgeと下側のVOrbit ASMRの間で声を送り、空間化した音を戻す。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#365bbb" stroke-width="2"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#087e77" stroke-width="2"/></marker></defs><rect width="1400" height="660" rx="28" fill="#f4f7fc"/><g font-family="Noto Sans JP, Yu Gothic, sans-serif"><text x="50" y="67" font-size="36" font-weight="800" fill="#182a48">VSTブリッジの音の流れ</text><text x="50" y="105" font-size="21" fill="#53657c">音を聴くまでの経路は左から右へ。空間化はトラック内のプラグインを通して行います。</text><rect x="50" y="182" width="195" height="165" rx="20" fill="#fff" stroke="#cad7e9" stroke-width="2"/><circle cx="105" cy="237" r="21" fill="#e5edfa"/><rect x="99" y="257" width="12" height="30" rx="5" fill="#365bbb"/><text x="76" y="321" font-size="28" font-weight="750" fill="#182a48">マイク</text><rect x="325" y="152" width="480" height="225" rx="24" fill="#eaf1ff" stroke="#93b0df" stroke-width="2"/><text x="351" y="195" font-size="27" font-weight="800" fill="#244ab0">DAWのマイクトラック</text><text x="352" y="227" font-size="18" fill="#53657c">入力モニターを有効にする</text><rect x="382" y="251" width="363" height="88" rx="16" fill="#fff" stroke="#789be0" stroke-width="3"/><text x="409" y="289" font-size="26" font-weight="800" fill="#182a48">VOrbit Bridge</text><text x="411" y="319" font-size="17" fill="#53657c">ここにVST3プラグインを挿す</text><rect x="889" y="182" width="195" height="165" rx="20" fill="#fff" stroke="#cad7e9" stroke-width="2"/><text x="916" y="255" font-size="25" font-weight="750" fill="#182a48">DAWの出力</text><text x="918" y="295" font-size="18" fill="#53657c">出力先を設定</text><rect x="1164" y="182" width="195" height="165" rx="20" fill="#fff" stroke="#cad7e9" stroke-width="2"/><path d="M1221 267v-30a42 42 0 0 1 84 0v30m-84-5h-15v35h15zm84 0h15v35h-15z" fill="none" stroke="#365bbb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1185" y="330" font-size="24" font-weight="750" fill="#182a48">ヘッドホン</text><g fill="none" stroke="#365bbb" stroke-width="5" marker-end="url(#a)"><path d="M251 265h61"/><path d="M811 265h65"/><path d="M1090 265h61"/></g><rect x="389" y="455" width="366" height="120" rx="22" fill="#e8f8f5" stroke="#65aea7" stroke-width="2"/><text x="430" y="505" font-size="29" font-weight="800" fill="#075c57">VOrbit ASMR</text><text x="430" y="544" font-size="22" fill="#286762">声を空間化するアプリ</text><path d="M475 345v95" fill="none" stroke="#365bbb" stroke-width="5" marker-end="url(#a)"/><path d="M675 447v-96" fill="none" stroke="#087e77" stroke-width="5" marker-end="url(#b)"/><text x="407" y="408" font-size="18" font-weight="700" fill="#365bbb">声を送る</text><text x="686" y="409" font-size="18" font-weight="700" fill="#087e77">空間化した音を戻す</text><text x="50" y="627" font-size="20" fill="#53657c">VOrbit ASMRはマイクやヘッドホンを直接開きません。入力・出力デバイスはDAW側で選びます。</text></g></svg>
