<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">VSTブリッジの音声の流れ</title><desc id="d">マイクからDAWのマイクトラックに入り、VOrbit BridgeがVOrbit ASMRへ音を送る。空間化された音が同じプラグインへ戻り、DAWの出力からヘッドホンへ届く。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#4d70c6" stroke-width="2"/></marker><marker id="returnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#118a81" stroke-width="2"/></marker></defs>
<rect width="1200" height="760" rx="28" fill="#f4f7fc"/><g font-family="Noto Sans JP, Yu Gothic, sans-serif"><text x="58" y="77" font-size="43" font-weight="800" fill="#19294b">VSTブリッジでは、音がこう流れます</text><text x="58" y="119" font-size="25" fill="#52627b">マイクと出力先はDAW側で選びます</text>
<rect x="55" y="205" width="230" height="190" rx="23" fill="white" stroke="#d4def0" stroke-width="2"/><text x="85" y="272" font-size="34" font-weight="800" fill="#19294b">マイク</text><text x="85" y="325" font-size="24" fill="#52627b">声を入力</text>
<rect x="363" y="175" width="390" height="270" rx="23" fill="#edf3ff" stroke="#9bb4e9" stroke-width="2"/><text x="395" y="235" font-size="29" font-weight="800" fill="#244ab7">DAWのマイクトラック</text><rect x="395" y="267" width="325" height="100" rx="17" fill="white" stroke="#c9d8f2"/><text x="416" y="310" font-size="28" font-weight="800" fill="#19294b">VOrbit Bridge</text><text x="416" y="344" font-size="20" fill="#52627b">トラックに挿すプラグイン</text>
<rect x="847" y="205" width="300" height="190" rx="23" fill="white" stroke="#d4def0" stroke-width="2"/><text x="876" y="269" font-size="32" font-weight="800" fill="#19294b">VOrbit ASMR</text><text x="876" y="323" font-size="24" fill="#52627b">声を空間化</text>
<path d="M289 302h63" stroke="#4d70c6" stroke-width="5" marker-end="url(#arrow)"/><path d="M756 288h78" stroke="#4d70c6" stroke-width="5" marker-end="url(#arrow)"/><text x="766" y="265" font-size="20" fill="#41526f">送る</text><path d="M839 359h-75" stroke="#118a81" stroke-width="5" marker-end="url(#returnArrow)"/><text x="775" y="391" font-size="20" fill="#0b7069">戻す</text>
<path d="M558 449v61" stroke="#4d70c6" stroke-width="5" marker-end="url(#arrow)"/><rect x="363" y="527" width="390" height="102" rx="21" fill="white" stroke="#d4def0" stroke-width="2"/><text x="395" y="589" font-size="29" font-weight="800" fill="#19294b">DAWの出力</text><path d="M757 578h77" stroke="#4d70c6" stroke-width="5" marker-end="url(#arrow)"/><rect x="847" y="527" width="300" height="102" rx="21" fill="white" stroke="#d4def0" stroke-width="2"/><text x="875" y="589" font-size="29" font-weight="800" fill="#19294b">ヘッドホン</text>
<text x="58" y="706" font-size="23" fill="#52627b">ポイント：VOrbit ASMRは音声デバイスを直接開かず、同じプラグイン位置へ音を返します。</text></g></svg>
