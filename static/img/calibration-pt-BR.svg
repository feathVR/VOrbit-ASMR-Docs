<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
<title id="t">Calibração em quatro passos</title><desc id="d">Atribua só o eixo horizontal, registre o centro olhando para a frente, meça a amplitude de movimento indo para os lados, termine a medição e confira Calibrado.</desc>
<rect width="1200" height="660" rx="28" fill="#f4f7fc"/><text x="60" y="82" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#19294b">Calibre nesta ordem</text><text x="60" y="126" font-family="Arial, sans-serif" font-size="25" fill="#4d5e7a">Conecte o rastreamento primeiro. Comece só com o eixo horizontal.</text>
<g font-family="Arial, sans-serif">
<rect x="55" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="95" cy="217" r="25" fill="#315ee0"/><text x="95" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">1</text><text x="77" y="290" font-size="28" font-weight="700" fill="#19294b">Horizontal</text><text x="77" y="345" font-size="23" fill="#4d5e7a">Vertical e</text><text x="77" y="385" font-size="23" fill="#4d5e7a">profundidade: “—”</text>
<rect x="335" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="375" cy="217" r="25" fill="#315ee0"/><text x="375" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">2</text><text x="357" y="290" font-size="28" font-weight="700" fill="#19294b">Olhe à frente</text><text x="357" y="345" font-size="23" fill="#4d5e7a">Postura habitual</text><text x="357" y="385" font-size="23" fill="#4d5e7a">→ Registrar centro</text>
<rect x="615" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="655" cy="217" r="25" fill="#315ee0"/><text x="655" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">3</text><text x="637" y="290" font-size="28" font-weight="700" fill="#19294b">Mova-se</text><text x="637" y="345" font-size="23" fill="#4d5e7a">Medir amplitude</text><text x="637" y="385" font-size="23" fill="#4d5e7a">→ devagar</text>
<rect x="895" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="935" cy="217" r="25" fill="#118a81"/><text x="935" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">4</text><text x="917" y="290" font-size="28" font-weight="700" fill="#19294b">Termine</text><text x="917" y="345" font-size="23" fill="#4d5e7a">Terminar medição</text><text x="917" y="385" font-size="23" fill="#4d5e7a">→ Calibrado</text>
<path d="M307 337h24m-13-12 13 12-13 12M587 337h24m-13-12 13 12-13 12M867 337h24m-13-12 13 12-13 12" fill="none" stroke="#6482c6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="533" width="1090" height="77" rx="17" fill="#e6f4f1"/><text x="83" y="581" font-size="25" fill="#0b7069">Depois mova o avatar para os lados e ouça sua voz se mover.</text>
</g></svg>
