<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Órbita y movimiento en plano</title><desc id="d">Vista superior conceptual. A la izquierda la voz sigue un arco alrededor del oyente; a la derecha, una línea recta.</desc><rect width="1200" height="650" rx="28" fill="#f4f7fc"/><text x="54" y="76" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#19294b">Dos formas de mover la voz</text><text x="54" y="115" font-family="Arial, sans-serif" font-size="24" fill="#52627b">Vista superior conceptual · movimiento horizontal</text><g font-family="Arial, sans-serif"><rect x="55" y="150" width="525" height="440" rx="22" fill="white" stroke="#d4def0" stroke-width="2"/><rect x="620" y="150" width="525" height="440" rx="22" fill="white" stroke="#d4def0" stroke-width="2"/><text x="84" y="208" font-size="30" font-weight="800" fill="#244ab7">Órbita alrededor de la cabeza</text><text x="650" y="208" font-size="30" font-weight="800" fill="#244ab7">Movimiento en plano</text><path d="M140 370 Q318 72 496 370" fill="none" stroke="#315ee0" stroke-width="8" stroke-linecap="round"/><circle cx="140" cy="370" r="16" fill="#315ee0"/><circle cx="318" cy="256" r="16" fill="#315ee0"/><circle cx="496" cy="370" r="16" fill="#315ee0"/><circle cx="318" cy="423" r="38" fill="#142a5b"/><text x="318" y="433" text-anchor="middle" font-size="23" fill="white">TÚ</text><text x="318" y="527" text-anchor="middle" font-size="24" fill="#41526f">La voz sigue un arco</text><path d="M700 310 H1065" fill="none" stroke="#118a81" stroke-width="8" stroke-linecap="round"/><circle cx="700" cy="310" r="16" fill="#118a81"/><circle cx="882" cy="310" r="16" fill="#118a81"/><circle cx="1065" cy="310" r="16" fill="#118a81"/><circle cx="882" cy="423" r="38" fill="#142a5b"/><text x="882" y="433" text-anchor="middle" font-size="23" fill="white">TÚ</text><text x="882" y="527" text-anchor="middle" font-size="24" fill="#41526f