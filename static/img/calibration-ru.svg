<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
<title id="t">Калибровка в четыре шага</title><desc id="d">Назначьте только горизонталь, запишите центр лицом вперёд, измерьте диапазон движений влево и вправо, завершите измерение и проверьте «Откалибровано».</desc>
<rect width="1200" height="660" rx="28" fill="#f4f7fc"/><text x="60" y="82" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#19294b">Калибруйте в таком порядке</text><text x="60" y="126" font-family="Arial, sans-serif" font-size="25" fill="#4d5e7a">Сначала подключите трекинг. Начните только с горизонтали.</text>
<g font-family="Arial, sans-serif">
<rect x="55" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="95" cy="217" r="25" fill="#315ee0"/><text x="95" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">1</text><text x="77" y="290" font-size="28" font-weight="700" fill="#19294b">Горизонталь</text><text x="77" y="345" font-size="23" fill="#4d5e7a">Остальные оси</text><text x="77" y="385" font-size="23" fill="#4d5e7a">оставьте «—»</text>
<rect x="335" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="375" cy="217" r="25" fill="#315ee0"/><text x="375" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">2</text><text x="357" y="290" font-size="28" font-weight="700" fill="#19294b">Лицом вперёд</text><text x="357" y="345" font-size="23" fill="#4d5e7a">Обычная поза</text><text x="357" y="385" font-size="23" fill="#4d5e7a">«Записать центр»</text>
<rect x="615" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="655" cy="217" r="25" fill="#315ee0"/><text x="655" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">3</text><text x="637" y="290" font-size="28" font-weight="700" fill="#19294b">Влево/вправо</text><text x="637" y="345" font-size="23" fill="#4d5e7a">Измерить диапазон</text><text x="637" y="385" font-size="23" fill="#4d5e7a">→ не спеша</text>
<rect x="895" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="935" cy="217" r="25" fill="#118a81"/><text x="935" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">4</text><text x="917" y="290" font-size="28" font-weight="700" fill="#19294b">Завершите</text><text x="917" y="345" font-size="23" fill="#4d5e7a">«Завершить»</text><text x="917" y="385" font-size="23" fill="#4d5e7a">«Откалибровано»</text>
<path d="M307 337h24m-13-12 13 12-13 12M587 337h24m-13-12 13 12-13 12M867 337h24m-13-12 13 12-13 12" fill="none" stroke="#6482c6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="533" width="1090" height="77" rx="17" fill="#e6f4f1"/><text x="83" y="581" font-size="25" fill="#0b7069">Затем подвигайте аватар влево и вправо и послушайте, как движется голос.</text>
</g></svg>
