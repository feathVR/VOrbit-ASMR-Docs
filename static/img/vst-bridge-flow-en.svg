<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc"><title id="title">VST bridge audio flow</title><desc id="desc">Audio travels from microphone through VOrbit Bridge on the DAW microphone track, then through the DAW output to headphones. The plug-in sends voice to VOrbit ASMR below and receives spatialized audio back.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#365bbb" stroke-width="2"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#087e77" stroke-width="2"/></marker></defs><rect width="1400" height="660" rx="28" fill="#f4f7fc"/><g font-family="Arial, sans-serif"><text x="50" y="67" font-size="36" font-weight="800" fill="#182a48">VST bridge audio flow</text><text x="50" y="105" font-size="21" fill="#53657c">Follow the listening path from left to right. Spatialization happens through the plug-in on the track.</text><rect x="50" y="182" width="195" height="165" rx="20" fill="#fff" stroke="#cad7e9" stroke-width="2"/><circle cx="105" cy="237" r="21" fill="#e5edfa"/><rect x="99" y="257" width="12" height="30" rx="5" fill="#365bbb"/><text x="73" y="321" font-size="26" font-weight="750" fill="#182a48">Microphone</text><rect x="325" y="152" width="480" height="225" rx="24" fill="#eaf1ff" stroke="#93b0df" stroke-width="2"/><text x="351" y="195" font-size="27" font-weight="800" fill="#244ab0">DAW microphone track</text><text x="352" y="227" font-size="18" fill="#53657c">Enable input monitoring</text><rect x="382" y="251" width="363" height="88" rx="16" fill="#fff" stroke="#789be0" stroke-width="3"/><text x="409" y="289" font-size="26" font-weight="800" fill="#182a48">VOrbit Bridge</text><text x="411" y="319" font-size="17" fill="#53657c">Insert the VST3 plug-in here</text><rect x="889" y="182" width="195" height="165" rx="20" fill="#fff" stroke="#cad7e9" stroke-width="2"/><text x="913" y="255" font-size="25" font-weight="750" fill="#182a48">DAW output</text><text x="918" y="295" font-size="18" fill="#53657c">Choose a device</text><rect x="1164" y="182" width="195" height="165" rx="20" fill="#fff" stroke="#cad7e9" stroke-width="2"/><path d="M1221 267v-30a42 42 0 0 1 84 0v30m-84-5h-15v35h15zm84 0h15v35h-15z" fill="none" stroke="#365bbb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1181" y="330" font-size="25" font-weight="750" fill="#182a48">Headphones</text><g fill="none" stroke="#365bbb" stroke-width="5" marker-end="url(#a)"><path d="M251 265h61"/><path d="M811 265h65"/><path d="M1090 265h61"/></g><rect x="389" y="455" width="366" height="120" rx="22" fill="#e8f8f5" stroke="#65aea7" stroke-width="2"/><text x="430" y="505" font-size="29" font-weight="800" fill="#075c57">VOrbit ASMR</text><text x="430" y="544" font-size="22" fill="#286762">Spatializes your voice</text><path d="M475 345v95" fill="none" stroke="#365bbb" stroke-width="5" marker-end="url(#a)"/><path d="M675 447v-96" fill="none" stroke="#087e77" stroke-width="5" marker-end="url(#b)"/><text x="413" y="408" font-size="18" font-weight="700" fill="#365bbb">Send voice</text><text x="685" y="409" font-size="18" font-weight="700" fill="#087e77">Return spatialized audio</text><text x="50" y="627" font-size="20" fill="#53657c">VOrbit ASMR does not open your microphone or headphones. Select input and output devices in the DAW.</text></g></svg>
