<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
<title id="t">四步完成校準</title><desc id="d">只設定左右軸，面向正面記錄中心，左右移動測量動作範圍，結束測量並確認「已校準」。</desc>
<rect width="1200" height="660" rx="28" fill="#f4f7fc"/><text x="60" y="82" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="44" font-weight="800" fill="#19294b">按這個順序校準</text><text x="60" y="126" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" fill="#4d5e7a">先連接追蹤。一開始只設定左右方向。</text>
<g font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif">
<rect x="55" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="95" cy="217" r="25" fill="#315ee0"/><text x="95" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">1</text><text x="77" y="290" font-size="28" font-weight="700" fill="#19294b">設定左右</text><text x="77" y="345" font-size="23" fill="#4d5e7a">上下和深度</text><text x="77" y="385" font-size="23" fill="#4d5e7a">保持「—」</text>
<rect x="335" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="375" cy="217" r="25" fill="#315ee0"/><text x="375" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">2</text><text x="357" y="290" font-size="28" font-weight="700" fill="#19294b">面向正面</text><text x="357" y="345" font-size="23" fill="#4d5e7a">保持平常的姿勢</text><text x="357" y="385" font-size="23" fill="#4d5e7a">→「記錄中心」</text>
<rect x="615" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="655" cy="217" r="25" fill="#315ee0"/><text x="655" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">3</text><text x="637" y="290" font-size="28" font-weight="700" fill="#19294b">左右移動</text><text x="637" y="345" font-size="23" fill="#4d5e7a">「測量動作範圍」</text><text x="637" y="385" font-size="23" fill="#4d5e7a">→ 慢慢左右移動</text>
<rect x="895" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="935" cy="217" r="25" fill="#118a81"/><text x="935" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">4</text><text x="917" y="290" font-size="28" font-weight="700" fill="#19294b">結束測量</text><text x="917" y="345" font-size="23" fill="#4d5e7a">「結束測量」</text><text x="917" y="385" font-size="23" fill="#4d5e7a">→「已校準」</text>
<path d="M307 337h24m-13-12 13 12-13 12M587 337h24m-13-12 13 12-13 12M867 337h24m-13-12 13 12-13 12" fill="none" stroke="#6482c6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="533" width="1090" height="77" rx="17" fill="#e6f4f1"/><text x="83" y="581" font-size="25" fill="#0b7069">完成後，左右移動虛擬形象，確認聲音的位置隨之移動。</text>
</g></svg>
