<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">VOrbit ASMR quick start</title>
  <desc id="desc">Use headphones, choose the Normal audio route and devices, press Start and check the meters. Move the voice in Manual mode. For automatic tracking, connect a source and calibrate the center and movement range.</desc>
  <rect width="1200" height="1600" fill="#f5f7fc"/>
  <rect x="0" y="0" width="1200" height="270" fill="#15234a"/>
  <text x="72" y="92" fill="#a5c4ff" font-family="Arial, sans-serif" font-size="27" font-weight="700">VOrbit ASMR  ·  FIRST STEPS</text>
  <text x="72" y="170" fill="#ffffff" font-family="Arial, sans-serif" font-size="62" font-weight="800">Make your first sound</text>
  <text x="72" y="225" fill="#d9e6ff" font-family="Arial, sans-serif" font-size="29">Put on headphones and follow these steps</text>
  <rect x="70" y="305" width="1060" height="715" rx="26" fill="#ffffff" stroke="#d9e1f2" stroke-width="2"/>
  <text x="110" y="360" fill="#244ab7" font-family="Arial, sans-serif" font-size="27" font-weight="800">FIRST: CHECK SOUND AND POSITION</text>
  <circle cx="135" cy="435" r="29" fill="#315ee0"/><text x="135" y="446" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">1</text>
  <text x="190" y="430" fill="#14223f" font-family="Arial, sans-serif" font-size="36" font-weight="700">Choose Normal on Devices</text>
  <text x="190" y="475" fill="#41526f" font-family="Arial, sans-serif" font-size="27">Set your microphone as Input, headphones as Output</text>
  <path d="M135 490v36" stroke="#9cb3e8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="135" cy="560" r="29" fill="#315ee0"/><text x="135" y="571" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">2</text>
  <text x="190" y="556" fill="#14223f" font-family="Arial, sans-serif" font-size="36" font-weight="700">Press Start and speak</text>
  <text x="190" y="601" fill="#41526f" font-family="Arial, sans-serif" font-size="27">Check the input and left/right output meters</text>
  <path d="M135 615v36" stroke="#9cb3e8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="135" cy="685" r="29" fill="#315ee0"/><text x="135" y="696" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">3</text>
  <text x="190" y="681" fill="#14223f" font-family="Arial, sans-serif" font-size="36" font-weight="700">Move your voice in Manual</text>
  <text x="190" y="726" fill="#41526f" font-family="Arial, sans-serif" font-size="27">Drag the red dot left and right on the position pad</text>
  <rect x="190" y="766" width="895" height="196" rx="20" fill="#edf3ff"/>
  <text x="222" y="817" fill="#244ab7" font-family="Arial, sans-serif" font-size="26" font-weight="700">Your basic sound setup is done</text>
  <text x="222" y="866" fill="#273955" font-family="Arial, sans-serif" font-size="27">Listen for your voice moving in your headphones.</text>
  <text x="222" y="916" fill="#52627b" font-family="Arial, sans-serif" font-size="24">Using a DAW? See the separate VST bridge guide.</text>
  <rect x="70" y="1055" width="1060" height="415" rx="26" fill="#ffffff" stroke="#d9e1f2" stroke-width="2"/>
  <text x="110" y="1115" fill="#0b7b73" font-family="Arial, sans-serif" font-size="29" font-weight="800">ONLY IF YOU WANT AUTOMATIC TRACKING</text>
  <circle cx="135" cy="1193" r="29" fill="#118a81"/><text x="135" y="1204" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">4</text>
  <text x="190" y="1188" fill="#14223f" font-family="Arial, sans-serif" font-size="34" font-weight="700">Connect tracking in Auto</text>
  <text x="190" y="1233" fill="#41526f" font-family="Arial, sans-serif" font-size="26">Choose a source, press Connect, assign X only</text>
  <path d="M135 1248v34" stroke="#9bcfca" stroke-width="5" stroke-linecap="round"/>
  <circle cx="135" cy="1315" r="29" fill="#118a81"/><text x="135" y="1326" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">5</text>
  <text x="190" y="1310" fill="#14223f" font-family="Arial, sans-serif" font-size="34" font-weight="700">Calibrate center and range</text>
  <text x="190" y="1355" fill="#41526f" font-family="Arial, sans-serif" font-size="26">Face front, then move left/right; check Calibrated</text>
  <text x="72" y="1535" fill="#52627b" font-family="Arial, sans-serif" font-size="23">For detailed controls, VST bridge, and troubleshooting, continue below.</text>
</svg>
