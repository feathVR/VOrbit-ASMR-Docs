<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
<title id="t">キャリブレーションの順序</title><desc id="d">X軸を選び、正面で中央を記録し、左右に動きながら可動範囲を測定し、測定を終了して較正済みを確認する。</desc>
<rect width="1200" height="660" rx="28" fill="#f4f7fc"/><text x="60" y="82" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="44" font-weight="800" fill="#19294b">キャリブレーションは、この順番で</text><text x="60" y="126" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="25" fill="#4d5e7a">トラッキングに接続してから、最初は左右（X軸）だけを設定</text>
<g font-family="Noto Sans JP, Yu Gothic, sans-serif">
<rect x="55" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="95" cy="217" r="25" fill="#315ee0"/><text x="95" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">1</text><text x="77" y="290" font-size="31" font-weight="700" fill="#19294b">X軸を選ぶ</text><text x="77" y="345" font-size="24" fill="#4d5e7a">Y・Zは「—」</text><text x="77" y="385" font-size="24" fill="#4d5e7a">のままでOK</text>
<rect x="335" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="375" cy="217" r="25" fill="#315ee0"/><text x="375" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">2</text><text x="357" y="290" font-size="31" font-weight="700" fill="#19294b">正面で中央</text><text x="357" y="345" font-size="24" fill="#4d5e7a">普段の姿勢で</text><text x="357" y="385" font-size="24" fill="#4d5e7a">「中央を記録」</text>
<rect x="615" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="655" cy="217" r="25" fill="#315ee0"/><text x="655" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">3</text><text x="637" y="290" font-size="31" font-weight="700" fill="#19294b">左右へ動く</text><text x="637" y="345" font-size="24" fill="#4d5e7a">「可動範囲を測定」</text><text x="637" y="385" font-size="24" fill="#4d5e7a">→ ゆっくり左右へ</text>
<rect x="895" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="935" cy="217" r="25" fill="#118a81"/><text x="935" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">4</text><text x="917" y="290" font-size="31" font-weight="700" fill="#19294b">測定を終了</text><text x="917" y="345" font-size="24" fill="#4d5e7a">「測定を終了」</text><text x="917" y="385" font-size="24" fill="#4d5e7a">→「較正済み」</text>
<path d="M307 337h24m-13-12 13 12-13 12M587 337h24m-13-12 13 12-13 12M867 337h24m-13-12 13 12-13 12" fill="none" stroke="#6482c6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="533" width="1090" height="77" rx="17" fill="#e6f4f1"/><text x="83" y="581" font-size="25" fill="#0b7069">完了したら、アバターを左右へ動かし、声の位置が動くか確認。</text>
</g></svg>
