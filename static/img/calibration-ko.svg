<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
<title id="t">4단계 보정</title><desc id="d">좌우 축만 설정하고, 정면에서 중앙을 기록하고, 좌우로 움직이며 동작 범위를 측정한 뒤, 측정을 끝내고 ‘보정 완료’를 확인합니다.</desc>
<rect width="1200" height="660" rx="28" fill="#f4f7fc"/><text x="60" y="82" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="44" font-weight="800" fill="#19294b">이 순서로 보정하세요</text><text x="60" y="126" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="25" fill="#4d5e7a">먼저 트래킹을 연결하세요. 처음엔 좌우 방향만 설정합니다.</text>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect x="55" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="95" cy="217" r="25" fill="#315ee0"/><text x="95" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">1</text><text x="77" y="290" font-size="28" font-weight="700" fill="#19294b">좌우 설정</text><text x="77" y="345" font-size="23" fill="#4d5e7a">상하와 깊이는</text><text x="77" y="385" font-size="23" fill="#4d5e7a">‘—’ 그대로</text>
<rect x="335" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="375" cy="217" r="25" fill="#315ee0"/><text x="375" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">2</text><text x="357" y="290" font-size="28" font-weight="700" fill="#19294b">정면 보기</text><text x="357" y="345" font-size="23" fill="#4d5e7a">평소 자세로</text><text x="357" y="385" font-size="23" fill="#4d5e7a">→ ‘중앙 기록’</text>
<rect x="615" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="655" cy="217" r="25" fill="#315ee0"/><text x="655" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">3</text><text x="637" y="290" font-size="28" font-weight="700" fill="#19294b">좌우로 움직이기</text><text x="637" y="345" font-size="23" fill="#4d5e7a">‘동작 범위 측정’</text><text x="637" y="385" font-size="23" fill="#4d5e7a">→ 천천히 좌우로</text>
<rect x="895" y="172" width="250" height="330" rx="22" fill="white" stroke="#cfd9eb" stroke-width="2"/><circle cx="935" cy="217" r="25" fill="#118a81"/><text x="935" y="227" text-anchor="middle" font-size="27" font-weight="800" fill="white">4</text><text x="917" y="290" font-size="28" font-weight="700" fill="#19294b">측정 끝내기</text><text x="917" y="345" font-size="23" fill="#4d5e7a">‘측정 끝내기’</text><text x="917" y="385" font-size="23" fill="#4d5e7a">→ ‘보정 완료’</text>
<path d="M307 337h24m-13-12 13 12-13 12M587 337h24m-13-12 13 12-13 12M867 337h24m-13-12 13 12-13 12" fill="none" stroke="#6482c6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="533" width="1090" height="77" rx="17" fill="#e6f4f1"/><text x="83" y="581" font-size="25" fill="#0b7069">완료되면 아바타를 좌우로 움직여 목소리 위치가 따라 움직이는지 확인하세요.</text>
</g></svg>
