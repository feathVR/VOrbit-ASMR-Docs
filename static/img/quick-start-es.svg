<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Inicio rápido de VOrbit ASMR</title>
  <desc id="desc">Ponte auriculares, elige la ruta de audio Normal y los dispositivos, pulsa Iniciar y revisa los medidores. Mueve la voz en modo Manual. Para el seguimiento automático, conecta una fuente y calibra el centro y el rango de movimiento.</desc>
  <rect width="1200" height="1600" fill="#f5f7fc"/>
  <rect x="0" y="0" width="1200" height="270" fill="#15234a"/>
  <text x="72" y="92" fill="#a5c4ff" font-family="Arial, sans-serif" font-size="27" font-weight="700">VOrbit ASMR  ·  PRIMEROS PASOS</text>
  <text x="72" y="170" fill="#ffffff" font-family="Arial, sans-serif" font-size="62" font-weight="800">Tu primer sonido</text>
  <text x="72" y="225" fill="#d9e6ff" font-family="Arial, sans-serif" font-size="29">Ponte auriculares y sigue estos pasos</text>
  <rect x="70" y="305" width="1060" height="715" rx="26" fill="#ffffff" stroke="#d9e1f2" stroke-width="2"/>
  <text x="110" y="360" fill="#244ab7" font-family="Arial, sans-serif" font-size="27" font-weight="800">PRIMERO: SONIDO Y POSICIÓN</text>
  <circle cx="135" cy="435" r="29" fill="#315ee0"/><text x="135" y="446" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">1</text>
  <text x="190" y="430" fill="#14223f" font-family="Arial, sans-serif" font-size="36" font-weight="700">Elige Normal en Dispositivos</text>
  <text x="190" y="475" fill="#41526f" font-family="Arial, sans-serif" font-size="27">Entrada: micrófono. Salida: auriculares</text>
  <path d="M135 490v36" stroke="#9cb3e8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="135" cy="560" r="29" fill="#315ee0"/><text x="135" y="571" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">2</text>
  <text x="190" y="556" fill="#14223f" font-family="Arial, sans-serif" font-size="36" font-weight="700">Pulsa Iniciar y habla</text>
  <text x="190" y="601" fill="#41526f" font-family="Arial, sans-serif" font-size="27">Revisa los medidores de entrada y salida I/D</text>
  <path d="M135 615v36" stroke="#9cb3e8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="135" cy="685" r="29" fill="#315ee0"/><text x="135" y="696" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">3</text>
  <text x="190" y="681" fill="#14223f" font-family="Arial, sans-serif" font-size="36" font-weight="700">Mueve tu voz en Manual</text>
  <text x="190" y="726" fill="#41526f" font-family="Arial, sans-serif" font-size="27">Arrastra el punto rojo a izquierda y derecha</text>
  <rect x="190" y="766" width="895" height="196" rx="20" fill="#edf3ff"/>
  <text x="222" y="817" fill="#244ab7" font-family="Arial, sans-serif" font-size="26" font-weight="700">La configuración básica está lista</text>
  <text x="222" y="866" fill="#273955" font-family="Arial, sans-serif" font-size="27">Escucha cómo se mueve tu voz en los auriculares.</text>
  <text x="222" y="916" fill="#52627b" font-family="Arial, sans-serif" font-size="24">¿Usas un DAW? Consulta la guía del puente VST.</text>
  <rect x="70" y="1055" width="1060" height="415" rx="26" fill="#ffffff" stroke="#d9e1f2" stroke-width="2"/>
  <text x="110" y="1115" fill="#0b7b73" font-family="Arial, sans-serif" font-size="29" font-weight="800">SOLO SI QUIERES SEGUIMIENTO AUTOMÁTICO</text>
  <circle cx="135" cy="1193" r="29" fill="#118a81"/><text x="135" y="1204" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">4</text>
  <text x="190" y="1188" fill="#14223f" font-family="Arial, sans-serif" font-size="34" font-weight="700">Conecta el seguimiento en Automático</text>
  <text x="190" y="1233" fill="#41526f" font-family="Arial, sans-serif" font-size="26">Elige la fuente, Conectar, solo horizontal</text>
  <path d="M135 1248v34" stroke="#9bcfca" stroke-width="5" stroke-linecap="round"/>
  <circle cx="135" cy="1315" r="29" fill="#118a81"/><text x="135" y="1326" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">5</text>
  <text x="190" y="1310" fill="#14223f" font-family="Arial, sans-serif" font-size="34" font-weight="700">Calibra el centro y el rango</text>
  <text x="190" y="1355" fill="#41526f" font-family="Arial, sans-serif" font-size="26">Centro, luego muévete; verifica Calibrado</text>
  <text x="72" y="1535" fill="#52627b" font-family="Arial, sans-serif" font-size="23">Más detalles, el puente VST y la solución de problemas, abajo.</text>
</svg>
